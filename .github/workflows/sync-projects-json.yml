name: Sync projects.json from Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch projects from Supabase
        run: |
          curl -sS \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=proj_id,name,engineer,status,ifa_due_date,ifc_due_date,notes&order=proj_id.asc" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            > projects.raw.json

          jq 'map({
            id: .proj_id,
            name: .name,
            engineer: .engineer,
            status: .status,
            ifa_due_date: .ifa_due_date,
            ifc_due_date: .ifc_due_date,
            notes: .notes
          })' projects.raw.json > projects.json

      - name: Commit projects.json if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add projects.json

          if git diff --cached --quiet; then
            echo "No changes to projects.json"
          else
            git commit -m "Sync projects.json from Supabase"
            git push
          fi
